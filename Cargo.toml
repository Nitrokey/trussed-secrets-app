[package]
name = "secrets-app"
version = "0.15.0"
authors = ["Nicolas Stalder <n@stalder.io>", "Szczepan Zalega <szczepan@nitrokey.com>"]
repository = "https://github.com/Nitrokey/trussed-secrets-app/"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Secrets App - a Trussed app to manage OTP and Password Safe features of Nitrokey 3"

[dependencies]
apdu-app = { version = "0.2",  optional = true }
ctaphid-app = { version = "0.2", optional = true }
cbor-smol = "0.5"
delog = "0.1.6"
flexiber = { version = "0.2", features = ["derive", "heapless"] }
heapless = "0.9"
heapless-bytes = { version = "0.5", features = ["heapless-0.9"] }
hex-literal = "0.3"
iso7816 = "0.2"
littlefs2-core = "0.1"
serde = { version = "1", default-features = false }
trussed-core = { version = "0.2", features = ["chacha8-poly1305", "crypto-client", "management-client", "hmac-sha1", "hmac-sha256", "filesystem-client", "sha256", "ui-client"] }
encrypted_container = { path = "components/encrypted_container" }
block-padding = "0.3.3"
bitflags = "2.3.1"

# extension
trussed-auth = "0.5"

[dev-dependencies]
trussed = { version = "0.1", default-features = false }

[features]
default = ["apdu-dispatch"]
devel = ["apdu-dispatch", "log-all", "delog/std-log", "devel-counters"]
apdu-dispatch = ["dep:apdu-app"]
ctaphid-dispatch = ["dep:ctaphid-app"]

# Count accesses to the read-only and read-write persistence storage
devel-counters = []

# Allow to use application over CTAPHID interface
ctaphid = ["ctaphid-dispatch"]

# Enable oath calculate-all command
calculate-all = []

# Require delay after failed request as a brute-force protection for Reverese HOTP Verification
brute-force-delay = []

log-all = []
log-none = []
log-trace = []
log-info = []
log-debug = []
log-warn = []
log-error = []

[patch.crates-io]
trussed = { git = "https://github.com/trussed-dev/trussed.git", rev = "0f8df68be879acdde1f8cf428c11e5d29692a47b" }

